<html>

<head>
    <h1>caluclator</h1>
</head>

<body>
    <p>this is a caluclator</p>
    <p id="result"></p>
    <p id="result1"></p>
    <p id="result2"></p>
    <p id="result3"></p>
    <script>

        var num1 = 16
        var num2 = 27
        var sum = num1 + num2
        var difference = num2 - num1
        var product = num1 * num2
        var quotient = num2 / num1
        document.getElementById("result").innerHTML = sum;
        document.getElementById("result1").innerHTML = difference;
        document.getElementById("result2").innerHTML = product;
        document.getElementById("result3").innerHTML = quotient;
    </script>






</body>

</html>
