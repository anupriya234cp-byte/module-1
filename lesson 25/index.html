<html>

<head>
    <title>Java Script Array</title>
</head>

<body>
    <h2>Let us learn something</h2>
    <p>to sort array in ascending order</p>
    <button onclick="ascending()">ascending order</button>
    <button onclick="descending()">descending order</button>

    <p id="result"></p>
    <script>
        var points = [400, 50, 78, 45, 56]
        document.GetElementById("result").innerHTML = points;

        function ascending() {
            points.sort(function (a,b) {
                return a - b
            });
            
        
        document.getElementById("result").innerHTML = points;
        }
        function descending() {
            points.sort(function (a,b) {
                return b - a
            
        });
        

        document.getElementById("result").innerHTML = points;
    }



    </script>
</body>






</html>
