<html>
<head>
    <h1>POSITIONING</h1>
    <style>
div{
    border:3px solid black;
}
div.sticky{
    position:sticky;
    border:3px solid black;
}
div.absolute{
border: 3px solid black;
position:absolute;
}
div.relative{
border: 3px solid black;
position:relative
}
div.fixed{
border: 3px solid black;
position:fixed;
}
    </style>
</head>
<div>
  this is something  
</div>
<div>
    this is also something
</div>
<div class="sticky"></div>
<div>
  this is boring  
</div>
<div class="absolute"></div>
<div>
    this sucks
</div>
<div class="relative"></div>
<div>
 i am bored   
</div>
<div class="fixed"></div>





</body>
</html>
